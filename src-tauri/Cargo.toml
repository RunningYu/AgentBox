[package]
name = "agentbox"
version = "0.5.197"
description = "AgentBox macOS client"
authors = ["AgentBox contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.5.0", features = [] }
tauri-plugin-opener = "2.2.6"
tauri-plugin-clipboard-manager = "2.2.2"
tauri-plugin-shell = "2.2.1"
dirs = "6.0.0"
libc = "0.2"
open = "5.3.2"
portable-pty = "0.9.0"
rfd = "0.15.4"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25.0", features = ["elcapitan"] }
core-foundation = "0.10.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "NSPanel", "NSRunningApplication", "NSScreen", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSGeometry", "NSString"] }
